<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<title>Jarvis</title>
<style>
  :root { --bg:#050b14; --cyan:#33d6ff; --dim:#6b8399; --card:#0c1726; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:#e6f3ff; font-family:system-ui,sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; letter-spacing:4px; color:var(--cyan); font-weight:600; }
  header button { background:none; border:1px solid #1d3248; color:var(--dim); border-radius:8px; padding:6px 10px; }
  #log { flex:1; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.4; font-size:15px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#12314a; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid #14283d; }
  #status { text-align:center; color:var(--dim); font-size:13px; height:20px; }
  #orbwrap { display:flex; justify-content:center; padding:10px 0 calc(24px + env(safe-area-inset-bottom)); }
  #orb { width:96px; height:96px; border-radius:50%; border:2px solid var(--cyan); background:
         radial-gradient(circle at 35% 30%, #5fe6ff, #0a5f7a 60%, #06222e); box-shadow:0 0 24px #33d6ff55; color:#fff; font-size:13px; }
  #orb.listening { animation:pulse 1s infinite; }
  #orb.thinking { animation:spin 1.2s linear infinite; border-style:dashed; }
  @keyframes pulse { 50% { box-shadow:0 0 50px #33d6ffcc; transform:scale(1.07);} }
  @keyframes spin { to { transform:rotate(360deg);} }
  dialog { background:var(--card); color:#e6f3ff; border:1px solid #1d3248; border-radius:14px; width:min(92vw,420px); }
  dialog label { display:block; margin:10px 0 4px; font-size:13px; color:var(--dim); }
  dialog input, dialog textarea { width:100%; background:#08111d; color:#e6f3ff; border:1px solid #1d3248; border-radius:8px; padding:8px; font-size:14px; }
  dialog .row { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
  dialog button { background:var(--cyan); color:#001; border:0; border-radius:8px; padding:8px 14px; font-weight:600; }
  dialog button.alt { background:#1d3248; color:#e6f3ff; }
</style>
</head>
<body>
<header><h1>JARVIS</h1><button id="settingsBtn">Settings</button></header>
<div id="log"></div>
<div id="status">Tap the orb and speak</div>
<div id="orbwrap"><button id="orb">TAP</button></div>

<dialog id="settings">
  <h3 style="margin:0 0 4px">Settings</h3>
  <label>Brain</label>
  <select id="provider" style="width:100%;background:#08111d;color:#e6f3ff;border:1px solid #1d3248;border-radius:8px;padding:8px">
    <option value="gemini">Google Gemini (free tier)</option>
    <option value="claude">Claude (paid API)</option>
  </select>
  <label>API key (stored only on this phone)</label>
  <input id="key" type="password" placeholder="Paste key here">
  <label>Model (leave blank for default)</label>
  <input id="model" placeholder="gemini-2.5-flash">
  <label>Your name</label>
  <input id="name" placeholder="e.g. Alex">
  <label>Personality</label>
  <textarea id="persona" rows="4"></textarea>
  <label><input type="checkbox" id="auto" style="width:auto"> Keep listening after each reply (hands-free)</label>
  <div class="row"><button class="alt" id="clear">Clear chat</button><button id="save">Save</button></div>
</dialog>

<script>
const MODEL = "claude-sonnet-5-5";
const DEFAULT_PERSONA = "You are Jarvis, a witty, calm, highly capable personal assistant. Address the user respectfully, with light dry humor. Replies are spoken aloud, so keep them short (1-3 sentences) and never use markdown, lists or emojis.";
const $ = id => document.getElementById(id);
const cfg = () => JSON.parse(localStorage.getItem("jarvis") || "{}");
let history = JSON.parse(localStorage.getItem("jarvisHistory") || "[]");
let rec, busy = false, listening = false;

function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text; $("log").appendChild(d); $("log").scrollTop = 1e9;
}
history.forEach(m => add(m.role, m.content));
const setState = (s, t) => { $("orb").className = s; $("status").textContent = t; };

function speak(text) {
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02; u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

async function ask(text) {
  const c = cfg();
  if (!c.key) { $("settings").showModal(); return; }
  history.push({ role: "user", content: text }); add("user", text);
  setState("thinking", "Thinking...");
  const now = new Date().toLocaleString();
  const system = (c.persona || DEFAULT_PERSONA) + (c.name ? ` The user's name is ${c.name}.` : "") + ` Current date and time: ${now}.`;
  try {
    let reply;
    if ((c.provider || "gemini") === "claude") {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": c.key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model: c.model || MODEL, max_tokens: 400, system, messages: history.slice(-20) })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.status);
      reply = j.content.map(b => b.text || "").join("").trim();
    } else {
      const model = c.model || "gemini-2.5-flash";
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(c.key)}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: history.slice(-20).map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
          generationConfig: { maxOutputTokens: 400 }
        })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.status);
      reply = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
      if (!reply) throw new Error("Empty reply from Gemini");
    }
    history.push({ role: "assistant", content: reply });
    localStorage.setItem("jarvisHistory", JSON.stringify(history.slice(-40)));
    add("assistant", reply);
    setState("", "Speaking...");
    await speak(reply);
  } catch (e) {
    history.pop(); add("assistant", "Error: " + e.message); setState("", "Error");
    return;
  }
  setState("", "Tap the orb and speak");
  if (cfg().auto) listen();
}

function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Speech recognition isn't supported here. Use Chrome on Android."); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = false;
  rec.onstart = () => { listening = true; setState("listening", "Listening..."); };
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onerror = e => { listening = false; setState("", e.error === "no-speech" ? "Didn't catch that" : "Mic error: " + e.error); };
  rec.onend = () => { listening = false; if ($("orb").className === "listening") setState("", "Tap the orb and speak"); };
  rec.start();
}

$("orb").onclick = () => { if (listening) rec.stop(); else listen(); };
$("settingsBtn").onclick = () => {
  const c = cfg(); $("key").value = c.key || ""; $("name").value = c.name || "";
  $("provider").value = c.provider || "gemini"; $("model").value = c.model || "";
  $("persona").value = c.persona || DEFAULT_PERSONA; $("auto").checked = !!c.auto;
  $("settings").showModal();
};
$("save").onclick = () => {
  localStorage.setItem("jarvis", JSON.stringify({ provider: $("provider").value, model: $("model").value.trim(), key: $("key").value.trim(), name: $("name").value.trim(), persona: $("persona").value.trim(), auto: $("auto").checked }));
  $("settings").close();
};
$("clear").onclick = () => { history = []; localStorage.removeItem("jarvisHistory"); $("log").innerHTML = ""; $("settings").close(); };
if (!cfg().key) setTimeout(() => $("settingsBtn").click(), 300);
</script>
</body>
</html>
